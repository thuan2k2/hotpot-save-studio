name: HotpotSaveEditor
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: app.crystal9093.red1252
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  HotpotSaveEditor:
    type: application
    platform: iOS
    sources:
      - path: HotpotSaveEditor
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Hotpot Save Studio
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        # This editor has no background task or Live Activity.  When it is
        # sent to the background, iOS terminates it instead of preserving a
        # suspended editing session.
        INFOPLIST_KEY_UIApplicationExitsOnSuspend: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
